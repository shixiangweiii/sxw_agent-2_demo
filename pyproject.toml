[project]
name = "sxw-optimization-demo"
version = "0.1.0"
description = "单机持久化可靠 Agent Runtime + 混合召回 RAG 参考实现"
requires-python = ">=3.12"
# 运行依赖见 requirements.txt（标准 pip 安装到 .venv/）

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/reliability"]
addopts = "-ra"
