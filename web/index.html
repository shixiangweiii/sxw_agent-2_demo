<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>sxw Agent Chat</title>
    <link rel="stylesheet" href="/chat-ui/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <aside class="side-panel" aria-label="会话与附件">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5 13.9 8.6 20 10.5 13.9 12.4 12 18.5 10.1 12.4 4 10.5 10.1 8.6Z"/></svg>
          </div>
          <div class="brand-text">
            <h1>Agent Chat</h1>
            <div class="health-pill">
              <span class="health-dot" aria-hidden="true"></span>
              <p id="healthStatus">连接中...</p>
            </div>
          </div>
        </div>

        <section class="side-section" aria-label="会话设置">
          <h2 class="side-title">会话设置</h2>
          <label class="field">
            <span>Agent</span>
            <input id="agentUuid" type="text" value="demo" autocomplete="off">
          </label>
          <label class="field">
            <span>User</span>
            <input id="userId" type="text" value="web-user" autocomplete="off">
          </label>
          <label class="field">
            <span>Session</span>
            <div class="inline-field">
              <input id="sessionId" type="text" autocomplete="off">
              <button id="newSessionBtn" class="icon-button" type="button" title="新会话" aria-label="新会话">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
              </button>
            </div>
          </label>
        </section>

        <section class="upload-section" aria-label="附件与知识库">
          <h2 class="side-title">附件与知识库</h2>
          <label class="file-button">
            <input id="documentInput" type="file" multiple accept=".txt,.md,.markdown,.pdf,.docx,text/plain,text/markdown,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
            <span>选择文档</span>
          </label>
          <label class="file-button">
            <input id="imageInput" type="file" accept="image/*">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
            <span>选择图片</span>
          </label>
          <div id="attachmentList" class="attachment-list" aria-live="polite"></div>
        </section>
      </aside>

      <section class="chat-panel" aria-label="聊天">
        <div id="messages" class="messages" aria-live="polite"></div>
        <form id="chatForm" class="composer">
          <textarea id="queryInput" rows="3" placeholder="输入问题，或选择文档/图片后发送" autocomplete="off"></textarea>
          <p class="composer-hint">支持 txt / md / pdf / docx 入库 · 图片提问 · 流式输出</p>
          <div class="composer-actions">
            <span id="composerStatus" class="composer-status"></span>
            <button id="stopBtn" class="secondary-button" type="button" disabled>
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>
              停止
            </button>
            <button id="sendBtn" class="primary-button" type="submit">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4Z"/></svg>
              发送
            </button>
          </div>
        </form>
      </section>
    </main>

    <script type="module" src="/chat-ui/app.js"></script>
  </body>
</html>
